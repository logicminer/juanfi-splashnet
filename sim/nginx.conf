server {
    listen 80;

    root /usr/share/nginx/html;
    index login.html;

    # JuanFi's core.js probes this before any vendo call (normally the
    # MikroTik status page); without it the coin flow silently stalls.
    location = /status {
        default_type text/plain;
        return 200 'IAMNOTLOGINSTRINGPLEASEDONTREMOVE';
    }
}
